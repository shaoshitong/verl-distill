[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "verl-distill"
version = "0.1.0"
description = "A structured training framework for Z-Image distillation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
  "pyyaml>=6,<7",
  "torch>=2.4",
  "torchvision>=0.19",
]

[project.optional-dependencies]
train = [
  "diffusers>=0.37.0,<0.38",
  "safetensors>=0.4",
  "transformers>=4.57,<5",
  "accelerate>=1.0",
  "peft>=0.18",
  "pylance>=0.20",
]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
verl-distill = "verl_distill.cli.train:main"

[tool.hatch.build.targets.wheel]
packages = ["src/verl_distill"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "verl_distill/configs"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
