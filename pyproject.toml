[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "verl-distill"
version = "0.1.0"
description = "Z-Image and Qwen-Image-2.1 distillation training"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
  "pyyaml>=6,<7",
  "torch>=2.4",
  "torchvision>=0.19",
]

[project.optional-dependencies]
train = [
  "diffusers>=0.37.0,<0.38",
  "safetensors>=0.4",
  "transformers>=4.57,<5",
  "accelerate>=1.0",
  "peft>=0.18",
  "pylance>=0.20",
]
qwen21 = [
  "diffusers>=0.37.0,<0.38",
  "transformers==5.17.0",
  "accelerate==1.13.0",
  "huggingface-hub==1.32.0",
  "tokenizers==0.23.2",
  "safetensors==0.8.0",
  "peft==0.18.1",
  "matplotlib>=3.10,<3.11",
  "einops>=0.8,<0.9",
]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
verl-distill = "verl_distill.cli.train:main"

[tool.hatch.build.targets.wheel]
packages = ["src/verl_distill"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel.force-include]
"configs" = "verl_distill/configs"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
