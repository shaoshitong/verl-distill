defaults:
  - ../../base/zimage.yaml
  - ../../methods/dmd.yaml

data:
  image_root: ${oc.env:TRAIN_IMAGE_ROOT,}
  image_key: image
  center_crop: true
  random_flip: false

optimizer:
  generator:
    lr: 5.0e-6
    betas: [0.0, 0.999]
    weight_decay: 1.0e-2
    max_grad_norm: 2.83
    lr_scheduler: cosine
    lr_decay_steps: 500
    lr_min: 5.0e-6
  fake_score:
    lr: 5.0e-6
    betas: [0.9, 0.999]
    weight_decay: 0.0
    max_grad_norm: 2.83
    lr_scheduler: cosine
    lr_decay_steps: 3000
    lr_min: 5.0e-6

model:
  fake_score_model: ${oc.env:ZIMAGE_FAKE_SCORE_MODEL_PATH,}

runtime:
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  max_train_steps: 0
  num_workers: 4
  gradient_checkpointing: true
  save_every_n_steps: 1000
  debug_every_n_steps: 50
  debug_cfg_scale: 0.0
  debug_seed: 42
  debug_prompts: ["a photo of a bench", "a photo of a cow"]
