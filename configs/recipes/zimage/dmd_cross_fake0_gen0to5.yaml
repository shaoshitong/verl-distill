model:
  pretrained_model: ${oc.env:ZIMAGE_MODEL_PATH}
  teacher_model: ${oc.env:ZIMAGE_TEACHER_MODEL_PATH}
  fake_score_model: ${oc.env:ZIMAGE_FAKE_SCORE_MODEL_PATH}
  fake_score_aux_time_embed: false
data:
  format: image_lance
  manifest: ''
  prompt_key: refined_prompt
  resolution: 1024
  image_root: ''
  image_key: image
  center_crop: true
  random_flip: false
  lance_data_dir: ${oc.env:TRAIN_LANCE_DATA_DIR}
  aspect_buckets:
  - - 1024
    - 1024
  - - 832
    - 1408
  - - 1408
    - 832
runtime:
  seed: 42
  output_dir: ${oc.env:OUTPUT_DIR,outputs/dmd_cross}
  resume_from: ${oc.env:RESUME_FROM}
  gradient_accumulation_steps: 4
  micro_batch_size: 1
  max_train_steps: 2500
  num_workers: 4
  gradient_checkpointing: true
  save_every_n_steps: 500
  debug_every_n_steps: 25
  debug_cfg_scale: 0.0
  debug_seed: 42
  debug_prompts:
  - a photo of a bench
  - a photo of a beautiful chinese girl
  debug_timestep_shift: 1.0
  debug_height: 1024
  debug_width: 1024
  debug_return_traj: true
  param_probe_every_n_steps: 1
  resume_optimizer_state: false
  allow_partial_model_state: true
distributed:
  backend: nccl
  fsdp_backend: fsdp1
  param_dtype: bfloat16
  reduce_dtype: float32
  buffer_dtype: float32
method:
  name: dmd_full
  params:
    transport_type: Linear
    num_train_timestep: 1000
    min_step_percent: 0.02
    max_step_percent: 0.98
    num_denoising_step: 4
    timestep_shift: 1.0
    backward_simulation: false
    backward_simulation_mode: uncorrelated
    real_guidance_scale: 5.5
    fake_guidance_scale: 0.0
    fake_score_use_generator_timestep: false
    dfake_gen_update_ratio: 4
    dm_loss_weight: 1.0
    loss_type: mse
    generator_objective: teacher_feature_ste
    gan_generator_loss_weight: 1.0
    gan_generator_loss_type: logit
    gan_discriminator_loss_weight: 1.0
    gan_discriminator_noise_sigma: 0.2
    gan_r1_weight: 0.0
    gan_r1_noise_std: 0.01
    gt_grad_loss_weight: 0.0
    grad_norm_eps: 1.0e-06
    score_loss_weight: 1.0
    score_use_weighting: false
    score_loss_target: x0
    sampling_steps: 4
    warmup_type: ode_pair
    warmup_iterations: 1000
    ode_warmup_loss_weight: 1.0
    ode_warmup_pair_dir: ${oc.env:ZIMAGE_ODE_PAIR_DIR}
    ode_warmup_generator_sigma_probs:
    - 0.8
    - 0.16
    - 0.032
    - 0.008
    ode_warmup_reward_weighting: source_rank
    ode_warmup_rank_weight_strength: 1.0
    ode_warmup_reward_weights:
      lance:
        aesthetic: 0.45
        color_harmony: 0.4
        instruction_following: 0.1
        score: 0.05
      text_render:
        instruction_following: 0.75
        aesthetic: 0.1
        color_harmony: 0.1
        score: 0.05
    teacher_feature_layers:
    - 1
    - 2
    - 3
    - 4
    - 5
    teacher_feature_timestep: 0.2
    teacher_feature_include_latent: true
    teacher_feature_include_last: false
    teacher_feature_normalize: true
    generator_teacher_feature_weights:
      latent: 1.0
      layer_1: 1.0
      layer_2: 1.0
      layer_3: 1.0
      layer_4: 1.0
      layer_5: 1.0
    score_objective: mse
    score_teacher_feature_weights:
      latent: 1.0
      layer_1: 1.0
      layer_2: 1.0
      layer_3: 1.0
      layer_4: 1.0
      layer_5: 1.0
    generator_teacher_feature_anchor: live
    generator_teacher_feature_loss_type:
      latent: ste
      layer_1: ste
      layer_2: ste
      layer_3: ste
      layer_4: ste
      layer_5: ste
    teacher_feature_grad_balance: null
optimizer:
  generator:
    lr: 5.0e-05
    betas:
    - 0.0
    - 0.999
    weight_decay: 0.01
    max_grad_norm: 2.83
    lr_scheduler: none
    lr_decay_steps: 500
    lr_min: 5.0e-06
    type: adamw_schedule_free
    warmup_lr: 0.0001
    warmup_betas:
    - 0.9
    - 0.999
  fake_score:
    lr: 1.0e-05
    betas:
    - 0.9
    - 0.999
    weight_decay: 0.0
    max_grad_norm: 1.0
    lr_scheduler: none
    lr_decay_steps: 3000
    lr_min: 5.0e-06
    type: adamw
    warmup_lr: 0.0
    warmup_betas:
    - 0.9
    - 0.999
