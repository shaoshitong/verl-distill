# HF initialization; DMD counts Fake updates. Intended for 4 nodes x 8 GPUs.
model:
  family: qwen_image21
  pretrained_model: ${oc.env:QWEN21_MODEL_PATH}
  revision: ${oc.env:QWEN21_MODEL_REVISION,b3179ad355be050328e483a9dfdd9e60cd62adfa}
data:
  format: qwen_image21_pairs
  manifest: ${oc.env:QWEN21_TRAIN_MANIFEST}
  eval_manifest: ${oc.env:QWEN21_EVAL_MANIFEST}
  condition_cache: ${oc.env:QWEN21_CONDITION_CACHE}
  output_root: ${oc.env:QWEN21_DATA_ROOT,}
  reference_root: ${oc.env:QWEN21_REFERENCE_ROOT,}
  negative_condition_cache: ${oc.env:QWEN21_NEGATIVE_CONDITION_CACHE}
method:
  name: dmd_full
  params:
    reflow_updates: 0
    fake_updates: 3000
    fake_updates_per_outer: 5
    nfe: 6
    generator_terminal: 0.4
    sampling: uniform
    generator_input: renoised_data
    fake_initialization: hf
    guidance: conditional_only
    score_grid_size: 1000
    score_sigma_min: 0.02
    score_sigma_max: 0.98
    fake_loss: velocity_mse
    fake_min_alpha: 0.0001
    fake_max_weight: 50.0
    fake_loss_weight: 1.0
    generator_loss_weight: 1.0
    normalization_eps: 1.0e-06
    dmd_surrogate_dtype: float64
    teacher_cfg_scale: 2.0
optimizer:
  reflow:
    type: adamw
    lr: 1.0e-05
    betas:
    - 0.9
    - 0.999
    weight_decay: 0.01
    max_grad_norm: 1.0
    lr_scheduler: none
  generator:
    type: adamw
    lr: 5.0e-07
    betas:
    - 0.0
    - 0.999
    weight_decay: 0.1
    max_grad_norm: 1.0
    lr_scheduler: none
  fake_score:
    type: adamw
    lr: 2.0e-06
    betas:
    - 0.9
    - 0.95
    weight_decay: 0.1
    max_grad_norm: 1.0
    lr_scheduler: none
runtime:
  output_dir: ${oc.env:OUTPUT_DIR}
  seed: 42
  micro_batch_size: 1
  reflow_gradient_accumulation_steps: 4
  gradient_accumulation_steps: 1
  debug_after_reflow: false
  reflow_checkpoint_steps: []
  debug_every_reflow_updates: 20
  debug_every_fake_updates: 20
  save_every_fake_updates: 600
  debug_prompts_csv: ${oc.env:QWEN21_DEBUG_CSV}
  debug_prompt_count: 8
  debug_comparison_steps: 25
  data_ordering: bucketed_v1
  bucket_batches: 64
  attention_backend: flash2_segmented
  offload_scores_for_generator_backward: false
  offload_inactive_for_fake: false
  early_dmd_checkpoint_steps:
  - 5
  - 40
  - 45
  debug_reflow_steps: []
  train_transformer_blocks_only: true
  resume_from: ${oc.env:QWEN21_RESUME_FROM,}
distributed:
  fsdp_backend: fsdp1
  param_dtype: bfloat16
  reduce_dtype: float32
  buffer_dtype: float32
  timeout_seconds: 7200
ema:
  enabled: false
