# Qwen 6-point renoising training; full six-call Euler rollout is debug/evaluation.
# DMD iterations count Fake optimizer updates, NOT outer iterations.
model:
  family: qwen_image21
  pretrained_model: ${oc.env:QWEN21_MODEL_PATH}
  revision: ${oc.env:QWEN21_MODEL_REVISION,b3179ad355be050328e483a9dfdd9e60cd62adfa}

data:
  format: qwen_image21_pairs
  manifest: ${oc.env:QWEN21_TRAIN_MANIFEST}
  eval_manifest: ${oc.env:QWEN21_EVAL_MANIFEST}
  condition_cache: ${oc.env:QWEN21_CONDITION_CACHE}
  # Optional overrides permit a byte-identical snapshot staged on local storage.
  output_root: ${oc.env:QWEN21_DATA_ROOT,}
  reference_root: ${oc.env:QWEN21_REFERENCE_ROOT,}

method:
  name: dmd_full
  params:
    reflow_updates: 1000
    fake_updates: 3000
    fake_updates_per_outer: 5
    nfe: 6
    generator_terminal: 0.4
    sampling: uniform
    generator_input: renoised_data
    fake_initialization: reflow_generator
    guidance: conditional_only
    score_grid_size: 1000
    score_sigma_min: 0.02
    score_sigma_max: 0.98
    # Legacy capped epsilon-equivalent objective.
    fake_loss: epsilon_via_x0_capped
    fake_min_alpha: 1.0e-4
    fake_max_weight: 50.0
    fake_loss_weight: 1.0
    generator_loss_weight: 4.0
    normalization_eps: 1.0e-6

optimizer:
  reflow:
    type: adamw
    lr: 1.0e-4
    betas: [0.9, 0.999]
    weight_decay: 1.0e-2
    max_grad_norm: 1.0
    lr_scheduler: none
  generator:
    type: adamw
    lr: 5.0e-7
    betas: [0.9, 0.999]
    weight_decay: 0.1
    max_grad_norm: 1.0
    lr_scheduler: none
  fake_score:
    type: adamw
    lr: 5.0e-6
    betas: [0.9, 0.95]
    weight_decay: 0.1
    max_grad_norm: 1.0
    lr_scheduler: none

runtime:
  output_dir: ${oc.env:OUTPUT_DIR}
  resume_from: ${oc.env:QWEN21_RESUME_FROM,}
  seed: 42
  data_ordering: bucketed_v1
  bucket_batches: 64
  attention_backend: flash2_segmented
  # Explicit opt-in for old SDPA/random checkpoints; only these infra fields may differ.
  allow_infra_resume_change: ${oc.env:QWEN21_ALLOW_INFRA_RESUME_CHANGE,false}
  micro_batch_size: 1
  reflow_gradient_accumulation_steps: 1
  gradient_accumulation_steps: 4
  debug_after_reflow: true
  debug_prompt_count: 8
  debug_comparison_steps: 25
  reflow_checkpoint_steps: [1, 500, 1000]
  debug_every_reflow_updates: 20
  debug_every_fake_updates: 20
  save_every_fake_updates: 600
  debug_prompts_csv: ${oc.env:QWEN21_DEBUG_CSV}

distributed:
  fsdp_backend: fsdp1
  param_dtype: bfloat16
  reduce_dtype: float32
  buffer_dtype: float32
  timeout_seconds: 7200

ema:
  enabled: false
